name: Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Chiqarilayotgan versiya (masalan: 1.0.1)'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17 muhitini o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle muhitini sozlash
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Versiyani aniqlash
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Aniqlangan versiya: $VERSION"

      - name: Plaginni yig'ish (Build Plugin ZIP)
        run: |
          gradle clean buildPlugin -Pversion=${VERSION} --no-daemon
          cp build/distributions/uysot-api-tester-plugin-${VERSION}.zip .

      - name: updatePlugins.xml faylini yangilash
        env:
          VERSION: ${{ env.VERSION }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'PYEOF'
          import os
          import inspect

          version = os.environ['VERSION']
          repo = os.environ['REPO']
          url = f"https://github.com/{repo}/releases/download/v{version}/uysot-api-tester-plugin-{version}.zip"

          xml_content = f"""<?xml version="1.0" encoding="UTF-8"?>
          <plugins>
              <plugin id="uz.uysot.api.tester"
                      url="{url}"
                      version="{version}">
                  <name>Uysot Open API Tester</name>
                  <description><![CDATA[
                      Backend dasturchilar uchun Uysot Open API avtomatlashtirilgan testlarini to'g'ridan-to'g'ri IntelliJ IDEA ichida ishga tushirish vositasi.
                  ]]></description>
                  <change-notes><![CDATA[
                      Versiya {version} yangilanishi.
                  ]]></change-notes>
                  <idea-version since-build="232" until-build="251.*"/>
              </plugin>
          </plugins>
          """

          cleaned = inspect.cleandoc(xml_content) + "\n"
          with open("updatePlugins.xml", "w", encoding="utf-8") as f:
              f.write(cleaned)
          PYEOF

      - name: updatePlugins.xml ni git ga yuklash (Commit & Push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main || git checkout -b main origin/main
          git pull origin main --rebase || true
          git add updatePlugins.xml
          git commit -m "Update plugin repository descriptor to v${VERSION} [skip ci]" || echo "O'zgarish yo'q"
          git push origin main || true

      - name: GitHub Release yaratish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "Uysot Open API Tester v${{ env.VERSION }}"
          draft: false
          prerelease: false
          files: |
            uysot-api-tester-plugin-${{ env.VERSION }}.zip
            updatePlugins.xml
