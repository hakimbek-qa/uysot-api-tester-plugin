name: Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Chiqarilayotgan versiya (masalan: 1.0.1)'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17 muhitini o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Versiyani aniqlash
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Aniqlangan versiya: $VERSION"

      - name: Plaginni yig'ish (Build Plugin ZIP)
        run: |
          mkdir -p build/compile build/pack/uysot-api-tester-plugin/lib
          
          # IntelliJ Platform Community libraries
          # We download minimal openapi.jar / platform stub for compilation in CI
          # Or compile with javac using download or gradle
          chmod +x ./gradlew 2>/dev/null || true
          
          # Standard compile and packaging
          # Update version in plugin.xml
          sed -i "s/<version>.*<\/version>/<version>${VERSION}<\/version>/g" src/main/resources/META-INF/plugin.xml 2>/dev/null || true
          
          # Gradle build if wrapper exists, otherwise direct jar
          if [ -f "./gradlew" ]; then
            ./gradlew buildPlugin -Pversion=${VERSION}
            cp build/distributions/*.zip uysot-api-tester-plugin-${VERSION}.zip
          else
            # Download IntelliJ Community stub libraries for headless build
            curl -sL https://cache-redirector.jetbrains.com/intellij-dependencies/org/jetbrains/intellij/deps/intellij-core/241.14494.240/intellij-core-241.14494.240.jar -o intellij-core.jar 2>/dev/null || true
            mkdir -p build/compile
            javac -cp "*:src/main/resources" -d build/compile $(find src/main/java -name "*.java") 2>/dev/null || true
            mkdir -p build/compile/META-INF
            cp src/main/resources/META-INF/plugin.xml build/compile/META-INF/
            jar cf build/pack/uysot-api-tester-plugin/lib/uysot-api-tester-plugin-${VERSION}.jar -C build/compile .
            cd build/pack && zip -r ../../uysot-api-tester-plugin-${VERSION}.zip uysot-api-tester-plugin && cd ../..
          fi

      - name: updatePlugins.xml faylini yangilash
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/uysot-api-tester-plugin-${VERSION}.zip"
          
          cat <<EOF > updatePlugins.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <plugins>
              <plugin id="uz.uysot.api.tester"
                      url="${DOWNLOAD_URL}"
                      version="${VERSION}">
                  <name>Uysot Open API Tester</name>
                  <description><![CDATA[
                      Backend dasturchilar uchun Uysot Open API avtomatlashtirilgan testlarini to'g'ridan-to'g'ri IntelliJ IDEA ichida ishga tushirish vositasi.
                  ]]></description>
                  <change-notes><![CDATA[
                      Versiya ${VERSION} yangilanishi.
                  ]]></change-notes>
                  <idea-version since-build="232" until-build="251.*"/>
              </plugin>
          </plugins>
          EOF

      - name: updatePlugins.xml ni git ga yuklash (Commit & Push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updatePlugins.xml
          git commit -m "Update plugin repository descriptor to v${VERSION} [skip ci]" || echo "O'zgarish yo'q"
          git push origin HEAD:main || true

      - name: GitHub Release yaratish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "Uysot Open API Tester v${{ env.VERSION }}"
          draft: false
          prerelease: false
          files: |
            uysot-api-tester-plugin-*.zip
            updatePlugins.xml
